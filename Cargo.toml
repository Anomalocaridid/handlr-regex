[package]
name = "handlr-regex"
version = "0.13.0"
authors = ["Duncan Russell <Duncan@anomalocaris.xyz>", "Gregory <gregory.mkv@gmail.com>"]
edition = "2021"
license = "MIT"
description = "Fork of handlr with regex support"
repository = "https://github.com/Anomalocaridid/handlr-regex"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
url = "2.5.7"
itertools = "0.14.0"
thiserror = "2.0.17"
xdg = "3.0.0"
mime = "0.3.17"
mime-db = "1.8.0"
confy = "2.0.0"
serde = { version = "1.0.228", features = ["derive"] }
xdg-mime = "0.4.0"
tabled = "0.20.0"
serde_json = "1.0"
enum_dispatch = "0.3.13"
derive_more = { version = "2.0.1", default-features = false, features = ["deref", "deref_mut", "display"] }
serde_ini = "0.2.0"
serde_with = "3.16.0"
wildmatch = "2.6.1"
mutants = "0.0.3"
clap_complete = { version = "4.5.60", features = ["unstable-dynamic"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tracing-appender = "0.2.3"
tracing-unwrap = "1.0.1"
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
notify-rust = "4.11.7"
execute = "0.2.13"
lazy-regex = { version = "3.4.2", default-features = false, features = ["lite"] }
freedesktop_entry_parser = "2.0.1"

[[bin]]
name = "handlr"
path = "src/main.rs"

[dev-dependencies]
insta = { version = "1.43.2", features = ["filters"] }
insta-cmd = "0.6.0"
pipe = "0.4.0"
similar-asserts = "1.7.0"
temp-env = "0.3.6"

[build-dependencies]
clap = { version = "4.5.51", features = ["derive"] }
clap_complete = { version = "4.5.60", features = ["unstable-dynamic"] }
clap_mangen = "0.2.31"
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev.package]
insta.opt-level = 3
